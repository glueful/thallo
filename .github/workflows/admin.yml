name: Admin SPA

on:
  push:
    branches: [dev]
    paths: ['admin/**', '.github/workflows/admin.yml']
  pull_request:
    branches: [main]
    paths: ['admin/**', '.github/workflows/admin.yml']

defaults:
  run:
    working-directory: admin

# One run per commit (2026-10-09): pushes to dev are tested; a dev -> main PR shows those checks
# (they are the head commit's), so only a PR from a fork runs here again, and a merge or a tag
# pushes nothing new. A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      # Skip dependency build scripts: esbuild ships a prebuilt platform binary and the app works
      # without vue-demi's switch, so they're unneeded — and pnpm 10+ exits non-zero on un-approved
      # builds otherwise.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build-only
