name: CI

on:
  push:
  pull_request:

# The Integration suite is split into four measured shards. Each CI job starts from a FRESH
# database, so a shard is measured the same way: reset, migrate, run it alone (2026-09-20, on a
# developer machine: 95s, 86s, 95s and 126s). Measure like that, not by aggregating one full run
# per directory — the database fills as a long run proceeds and every later test slows with it, so
# a full run said Render was 218s of 830s when alone it is 70s.
#
# It was two shards when measured on 2026-07-22. By September shard A took over 15 minutes on a CI
# runner and was killed by the watchdog below at 98%, with no failing test. When a shard nears the
# watchdog again, re-measure and split further rather than raising the limit.
#
# Regrouping changes which directory meets the fresh database first, and that is how a hidden
# order dependency shows: this split found that provision re-granted cross-workspace authority to
# administrators, which the old order never looked at after a provision had run. Verify a new
# grouping locally, each shard on a fresh database, before relying on it.
#
# A NEW top-level entry under tests/Integration — directory OR loose *Test.php — MUST be added to
# exactly one shard list below; the "Shard coverage guard" step fails every job if an entry is
# unassigned or listed twice, so a new directory can never silently skip CI.
env:
  # ~95s alone
  INTEGRATION_SHARD_A: >-
    tests/Integration/Render
    tests/Integration/Collections
    tests/Integration/Search
  # ~86s alone
  INTEGRATION_SHARD_B: >-
    tests/Integration/Commerce
  # ~95s alone
  INTEGRATION_SHARD_C: >-
    tests/Integration/Content
    tests/Integration/Account
    tests/Integration/Tenancy
    tests/Integration/Signup
  # ~126s alone
  INTEGRATION_SHARD_D: >-
    tests/Integration/Subscriptions
    tests/Integration/Http
    tests/Integration/Settings
    tests/Integration/Setup
    tests/Integration/Seo
    tests/Integration/Workflow
    tests/Integration/Pipeline
    tests/Integration/ImportExport
    tests/Integration/Console
    tests/Integration/Navigation
    tests/Integration/Forms
    tests/Integration/Updates
    tests/Integration/Blocks
    tests/Integration/Migrations
    tests/Integration/Importers
    tests/Integration/Contracts
    tests/Integration/Routing
    tests/Integration/Schema
    tests/Integration/Capabilities
    tests/Integration/Analytics
    tests/Integration/Authority
    tests/Integration/Indexing
    tests/Integration/ApiKeyScopesTest.php
    tests/Integration/DeliveryFlowTest.php
    tests/Integration/FoundationFlowTest.php
    tests/Integration/PreviewFlowTest.php

jobs:
  test:
    name: ${{ matrix.shard }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [lint-unit, integration-a, integration-b, integration-c, integration-d]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_DRIVER: pgsql
      DB_PGSQL_HOST: 127.0.0.1
      DB_PGSQL_PORT: 5432
      DB_PGSQL_DATABASE: app_test
      DB_PGSQL_USERNAME: postgres
      DB_PGSQL_PASSWORD: postgres
      # Sequential test run gets no benefit from pooling and the pool's acquire
      # path deadlocks the CLI migration bootstrap (1 active / 0 available / 30s
      # timeout). Matches the .env.example default.
      DB_POOLING_ENABLED: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create test environment
        run: |
          cat > .env <<'EOF'
          APP_NAME=Thallo
          APP_ENV=testing
          APP_DEBUG=true
          APP_KEY=0123456789abcdef0123456789abcdef
          JWT_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          TOKEN_SALT=0123456789abcdef0123456789abcdef
          DB_DRIVER=pgsql
          DB_PGSQL_HOST=127.0.0.1
          DB_PGSQL_PORT=5432
          DB_PGSQL_DATABASE=app_test
          DB_PGSQL_USERNAME=postgres
          DB_PGSQL_PASSWORD=postgres
          DB_PGSQL_SCHEMA=public
          DB_POOLING_ENABLED=false
          CACHE_DRIVER=array
          CACHE_TAGS=false
          QUERY_CACHE_ENABLED=false
          QUERY_CACHE_STORE=array
          QUEUE_CONNECTION=database
          EOF

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # NO `php glueful extensions:cache` step here, deliberately. Outside production the framework
      # trusts bootstrap/cache/extensions.php for 5 seconds after it is written
      # (EXTENSIONS_CACHE_TTL_DEV), and a cached boot loads the CACHED provider list — it ignores a
      # test's own `extensions.enabled` override. Written just before PHPUnit starts (the database
      # steps between take ~2s), it made the first seconds of every shard boot that way. That was
      # invisible while Render ran first, since its boots override nothing; with Subscriptions
      # first, CapabilityEngineTruthTableTest's engine-disabled boot landed inside the window, got
      # the full provider list against a container built without the engine, failed to boot, and
      # never registered its capability. The tests that need a cached boot write their own cache
      # and restore it, mtime included (tests/Support/BootsFromExtensionProviderCache.php).

      # Every tests/Integration entry must be assigned to exactly one shard, or the split
      # silently stops running new directories. Fails loudly with the unassigned names.
      - name: Shard coverage guard
        run: |
          covered=$(printf '%s %s %s %s' "$INTEGRATION_SHARD_A" "$INTEGRATION_SHARD_B" "$INTEGRATION_SHARD_C" "$INTEGRATION_SHARD_D" | tr ' ' '\n' | sed '/^$/d; s#^tests/Integration/##' | sort)
          actual=$(ls tests/Integration | sort)
          twice=$(echo "$covered" | uniq -d)
          if [ -n "$twice" ]; then
            echo "::error::tests/Integration entries assigned to MORE than one shard (they would run twice):"
            echo "$twice"
            exit 1
          fi
          missing=$(comm -23 <(echo "$actual") <(echo "$covered"))
          stale=$(comm -13 <(echo "$actual") <(echo "$covered"))
          if [ -n "$missing" ]; then
            echo "::error::tests/Integration entries not assigned to any shard (add them to a shard list in ci.yml):"
            echo "$missing"
            exit 1
          fi
          if [ -n "$stale" ]; then
            echo "::error::shard lists reference tests/Integration entries that no longer exist (remove them from ci.yml):"
            echo "$stale"
            exit 1
          fi
          echo "Shard coverage OK"

      # Safety net + diagnostic: a deadlocked or runaway query must fail FAST with the
      # offending test named, never hang the job. lock_timeout aborts a query that waits
      # >30s for a lock (surfaces cross-session deadlocks); statement_timeout aborts any
      # single query running >120s (surfaces a runaway/blocked statement). Both are set on
      # the database so every test connection inherits them and survive the schema reset
      # below (ALTER DATABASE settings persist across a DROP SCHEMA). The generous
      # ceilings leave real migrations and tests untouched.
      - name: Arm DB timeouts (fail fast + name the culprit instead of hanging)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d app_test \
            -c "ALTER DATABASE app_test SET lock_timeout = '30s';" \
            -c "ALTER DATABASE app_test SET statement_timeout = '120s';"

      - name: Reset and migrate test database
        run: |
          composer test:reset-db
          composer test:migrate

      # A 15-minute watchdog wraps each shard as a last-resort backstop: a wedged test
      # aborts at 120s via phpunit.xml's enforceTimeLimit, and DB stalls abort via the
      # timeouts armed above — but if something ever slips past all of those, the job
      # still ends instead of burning minutes until someone cancels it.
      - name: Run shard
        run: |
          case "${{ matrix.shard }}" in
            lint-unit)
              composer phpcs
              timeout --signal=KILL 900 vendor/bin/phpunit --testsuite Feature,Unit
              # Distribution-defaults posture (charter CI item (b)): runs LAST in this shard
              # because it resets app_test and re-migrates under the TRIMMED fresh-install
              # extensions list — proving installed-but-disabled as users receive it.
              timeout --signal=KILL 300 composer test:distribution
              ;;
            integration-a)
              timeout --signal=KILL 900 vendor/bin/phpunit $INTEGRATION_SHARD_A
              ;;
            integration-b)
              timeout --signal=KILL 900 vendor/bin/phpunit $INTEGRATION_SHARD_B
              ;;
            integration-c)
              timeout --signal=KILL 900 vendor/bin/phpunit $INTEGRATION_SHARD_C
              ;;
            integration-d)
              timeout --signal=KILL 900 vendor/bin/phpunit $INTEGRATION_SHARD_D
              ;;
          esac

  # The skeleton smoke: install skeleton/ (what create-project ships) against the LOCAL core and
  # packs via path repositories, then run the documented first-run sequence against Postgres.
  # Proves the split without Packagist; the release's clean-machine gate proves it with it.
  skeleton-smoke:
    name: skeleton-smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_DRIVER: pgsql
      DB_PGSQL_HOST: 127.0.0.1
      DB_PGSQL_PORT: 5432
      DB_PGSQL_DATABASE: app_test
      DB_PGSQL_USERNAME: postgres
      DB_PGSQL_PASSWORD: postgres
      DB_POOLING_ENABLED: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create the dev .env the smoke reads credentials from
        run: |
          cat > .env <<'EOF2'
          APP_ENV=testing
          DB_DRIVER=pgsql
          DB_PGSQL_HOST=127.0.0.1
          DB_PGSQL_PORT=5432
          DB_PGSQL_DATABASE=app_test
          DB_PGSQL_USERNAME=postgres
          DB_PGSQL_PASSWORD=postgres
          DB_POOLING_ENABLED=false
          EOF2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Admin lint, format check and tests
        run: cd admin && pnpm install --frozen-lockfile && pnpm run -s lint && pnpm run -s fmt:check && pnpm test

      - name: Build the admin bundle into core/resources/admin
        run: cd admin && pnpm run -s build

      - name: Install the dev root (reset-test-db needs its vendor)
        run: composer install --no-interaction --prefer-dist

      - name: Skeleton smoke
        # error_log to stderr: boot warnings the smoke's PHP processes would otherwise hide.
        env:
          PHP: php -d error_log=/dev/stderr
        run: timeout --signal=KILL 900 composer test:skeleton
