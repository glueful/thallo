name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_DRIVER: pgsql
      DB_PGSQL_HOST: 127.0.0.1
      DB_PGSQL_PORT: 5432
      DB_PGSQL_DATABASE: app_test
      DB_PGSQL_USERNAME: postgres
      DB_PGSQL_PASSWORD: postgres
      # Sequential test run gets no benefit from pooling and the pool's acquire
      # path deadlocks the CLI migration bootstrap (1 active / 0 available / 30s
      # timeout). Matches the .env.example default.
      DB_POOLING_ENABLED: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create test environment
        run: |
          cat > .env <<'EOF'
          APP_NAME=Thallo
          APP_ENV=testing
          APP_DEBUG=true
          APP_KEY=0123456789abcdef0123456789abcdef
          JWT_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          TOKEN_SALT=0123456789abcdef0123456789abcdef
          DB_DRIVER=pgsql
          DB_PGSQL_HOST=127.0.0.1
          DB_PGSQL_PORT=5432
          DB_PGSQL_DATABASE=app_test
          DB_PGSQL_USERNAME=postgres
          DB_PGSQL_PASSWORD=postgres
          DB_PGSQL_SCHEMA=public
          DB_POOLING_ENABLED=false
          CACHE_DRIVER=array
          CACHE_TAGS=false
          QUERY_CACHE_ENABLED=false
          QUERY_CACHE_STORE=array
          QUEUE_CONNECTION=database
          EOF

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Cache extension discovery
        run: php glueful extensions:cache

      # Safety net + diagnostic: a deadlocked or runaway query must fail FAST with the
      # offending test named, never hang the job. lock_timeout aborts a query that waits
      # >30s for a lock (surfaces cross-session deadlocks); statement_timeout aborts any
      # single query running >120s (surfaces a runaway/blocked statement). Both are set on
      # the database so every test connection inherits them and survive the schema reset
      # inside `composer ci` (ALTER DATABASE settings persist across a DROP SCHEMA). The
      # generous ceilings leave real migrations and tests untouched.
      - name: Arm DB timeouts (fail fast + name the culprit instead of hanging)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d app_test \
            -c "ALTER DATABASE app_test SET lock_timeout = '30s';" \
            -c "ALTER DATABASE app_test SET statement_timeout = '120s';"

      # TEMP DIAGNOSTIC v2: the tail -f streaming variant printed nothing (PHPUnit recreates
      # the event-log file, so tail followed a dead inode). This version is deterministic:
      # run phpunit under a HARD 10-minute watchdog, then ALWAYS print the tail of the
      # per-test event log — the last `Test Prepared (…)` line IS the wedged test, and the
      # event timestamps distinguish a true hang from a slow-grind (e.g. every test eating a
      # 30s lock timeout looks frozen from the buffered dots). On failure, also print
      # surviving php processes (a wedged proc_open child shows up as an orphan) and
      # pg_stat_activity (what each DB session was waiting on). Revert to `composer ci`
      # once the culprit is named.
      - name: Run CI
        run: |
          composer phpcs
          composer test:reset-db
          composer test:migrate
          set +e
          timeout --signal=KILL 600 vendor/bin/phpunit --log-events-verbose-text /tmp/pu_events.log
          STATUS=$?
          echo ""
          echo "=== phpunit exit status: $STATUS (137 = killed by the 10-min watchdog) ==="
          echo "=== last 60 event-log lines — the wedged test is the LAST one listed ==="
          tail -n 60 /tmp/pu_events.log || true
          if [ "$STATUS" -ne 0 ]; then
            echo "=== surviving php processes (orphaned proc_open children show here) ==="
            ps auxww | grep -E "php" | grep -v grep || true
            echo "=== postgres session states ==="
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d app_test -c "select pid, state, wait_event_type, wait_event, now()-query_start as query_age, left(query,120) as query from pg_stat_activity where datname='app_test' order by query_start;" || true
          fi
          exit $STATUS
