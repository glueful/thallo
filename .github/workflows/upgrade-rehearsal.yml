name: upgrade-rehearsal

# Visual builder plan A1.6 / spec §7.6: the populated beta.28 fixture is upgraded by this
# checkout's migrations (and, from slice A4, converted) on every push and pull request. A
# fresh-install smoke cannot exercise conversion; this job can.
on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_DRIVER: pgsql
      DB_PGSQL_HOST: 127.0.0.1
      DB_PGSQL_PORT: 5432
      DB_PGSQL_DATABASE: app_test
      DB_PGSQL_USERNAME: postgres
      DB_PGSQL_PASSWORD: postgres
      DB_POOLING_ENABLED: false
    steps:
      - uses: actions/checkout@v5
      - name: Test environment
        run: |
          cat > .env <<'ENV'
          APP_NAME=Thallo
          APP_ENV=testing
          APP_DEBUG=true
          APP_KEY=0123456789abcdef0123456789abcdef
          JWT_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          TOKEN_SALT=0123456789abcdef0123456789abcdef
          DB_DRIVER=pgsql
          DB_PGSQL_HOST=127.0.0.1
          DB_PGSQL_PORT=5432
          DB_PGSQL_DATABASE=app_test
          DB_PGSQL_USERNAME=postgres
          DB_PGSQL_PASSWORD=postgres
          DB_PGSQL_SCHEMA=public
          DB_POOLING_ENABLED=false
          CACHE_DRIVER=array
          CACHE_TAGS=false
          ENV
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer
      - name: Install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Extension cache
        run: php glueful extensions:cache
      - name: Postgres client
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: Rehearse the upgrade
        run: composer test:upgrade
