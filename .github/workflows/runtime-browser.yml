name: Runtime Browser

on:
  push:
    paths:
      - 'packages/thallo-render/**'
      - 'packages/thallo-contracts/src/Style/**'
      - 'tests/fixtures/layout/**'
      - 'tools/runtime-browser/**'
      - 'scripts/build-layout-proof-fixtures'
      - 'scripts/build-parity-fixtures'
      - 'scripts/build-docs-proof-fixtures'
      - 'scripts/build-product-layout-proof-fixtures'
      - 'scripts/build-listing-layout-proof-fixtures'
      - 'scripts/build-shop-layout-proof-fixtures'
      - 'scripts/build-shop-block-proof-fixtures'
      - 'scripts/build-typography-bridge-fixtures'
      - 'scripts/build-text-style-fixtures'
      - 'scripts/build-hover-fixtures'
      - 'packages/thallo-commerce/assets/shop.js'
      - 'packages/thallo-commerce/src/Shop/ShopAssetMap.php'
      - 'tests/fixtures/render/**'
      - 'tests/Support/ListingPageSeed.php'
      - 'tests/Support/ProductPageSeed.php'
      - 'tests/Support/ShopPageSeed.php'
      # The layout starters and surfaces the listing and product proofs render, and the pages they
      # render from.
      - 'core/src/Content/Layouts/**'
      - 'core/src/Content/Blocks/StarterBlockTypes.php'
      - 'core/src/Content/Delivery/**'
      - 'packages/thallo-contracts/src/Layouts/**'
      - 'packages/thallo-commerce/src/Layouts/**'
      - 'tests/fixtures/commerce/**'
      - 'packages/thallo-commerce/templates/**'
      - 'packages/thallo-commerce/assets/shop.css'
      - 'packages/thallo-importers/**'
      - 'core/src/Content/Docs/**'
      - 'admin/src/assets/print.css'
      - 'admin/src/pages/commerce/orders/components/InvoiceDocument.vue'
      - 'admin/src/pages/commerce/orders/**/invoice.vue'
      - 'admin/src/layouts/default.vue'
  pull_request:
    paths:
      - 'packages/thallo-render/**'
      - 'packages/thallo-contracts/src/Style/**'
      - 'tests/fixtures/layout/**'
      - 'tools/runtime-browser/**'
      - 'scripts/build-layout-proof-fixtures'
      - 'scripts/build-parity-fixtures'
      - 'scripts/build-docs-proof-fixtures'
      - 'scripts/build-product-layout-proof-fixtures'
      - 'scripts/build-listing-layout-proof-fixtures'
      - 'scripts/build-shop-layout-proof-fixtures'
      - 'scripts/build-shop-block-proof-fixtures'
      - 'scripts/build-typography-bridge-fixtures'
      - 'scripts/build-text-style-fixtures'
      - 'scripts/build-hover-fixtures'
      - 'packages/thallo-commerce/assets/shop.js'
      - 'packages/thallo-commerce/src/Shop/ShopAssetMap.php'
      - 'tests/fixtures/render/**'
      - 'tests/Support/ListingPageSeed.php'
      - 'tests/Support/ProductPageSeed.php'
      - 'tests/Support/ShopPageSeed.php'
      # The layout starters and surfaces the listing and product proofs render, and the pages they
      # render from.
      - 'core/src/Content/Layouts/**'
      - 'core/src/Content/Blocks/StarterBlockTypes.php'
      - 'core/src/Content/Delivery/**'
      - 'packages/thallo-contracts/src/Layouts/**'
      - 'packages/thallo-commerce/src/Layouts/**'
      - 'tests/fixtures/commerce/**'
      - 'packages/thallo-commerce/templates/**'
      - 'packages/thallo-commerce/assets/shop.css'
      - 'packages/thallo-importers/**'
      - 'core/src/Content/Docs/**'
      - 'admin/src/assets/print.css'
      - 'admin/src/pages/commerce/orders/components/InvoiceDocument.vue'
      - 'admin/src/pages/commerce/orders/**/invoice.vue'
      - 'admin/src/layouts/default.vue'

defaults:
  run:
    working-directory: tools/runtime-browser

jobs:
  test:
    runs-on: ubuntu-latest

    # The layout proofs measure PAGES THIS JOB RENDERS: the fixtures are built from the committed
    # cases through the real templates, theme and compiler, so a contract change is measured, never
    # a stale artifact. Rendering needs the application, which needs a database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_DRIVER: pgsql
      DB_PGSQL_HOST: 127.0.0.1
      DB_PGSQL_PORT: 5432
      DB_PGSQL_DATABASE: app_test
      DB_PGSQL_USERNAME: postgres
      DB_PGSQL_PASSWORD: postgres
      DB_POOLING_ENABLED: false

    steps:
      - uses: actions/checkout@v6

      - name: Create test environment
        working-directory: .
        run: |
          cat > .env <<'EOF'
          APP_NAME=Thallo
          APP_ENV=testing
          APP_DEBUG=true
          APP_KEY=0123456789abcdef0123456789abcdef
          JWT_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          TOKEN_SALT=0123456789abcdef0123456789abcdef
          DB_DRIVER=pgsql
          DB_PGSQL_HOST=127.0.0.1
          DB_PGSQL_PORT=5432
          DB_PGSQL_DATABASE=app_test
          DB_PGSQL_USERNAME=postgres
          DB_PGSQL_PASSWORD=postgres
          DB_PGSQL_SCHEMA=public
          DB_POOLING_ENABLED=false
          CACHE_DRIVER=array
          CACHE_TAGS=false
          QUERY_CACHE_ENABLED=false
          QUERY_CACHE_STORE=array
          QUEUE_CONNECTION=database
          EOF

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        working-directory: .
        run: composer install --no-interaction --prefer-dist

      - name: Reset and migrate test database
        working-directory: .
        run: |
          composer test:reset-db
          composer test:migrate

      - name: Build the layout proof fixtures
        working-directory: .
        run: php scripts/build-layout-proof-fixtures

      # The compositions measured against the frozen references (parity.spec.js, retirement.spec.js
      # and layout.spec.js's container cases). The pages are gitignored, so a checkout has none.
      - name: Build the parity fixtures
        working-directory: .
        run: php scripts/build-parity-fixtures

      # A documentation section as the application serves it (docs-layout.spec.js): set up,
      # imported from Markdown, fetched through the kernel. Gitignored, like the rest.
      - name: Build the docs fixtures
        working-directory: .
        run: php scripts/build-docs-proof-fixtures

      # The shop's product page as the application serves it (product-layout.spec.js): one product
      # seeded with fixed values, rendered through the shop controller, then rolled back.
      - name: Build the product layout fixtures
        working-directory: .
        run: php scripts/build-product-layout-proof-fixtures

      # The content-type listing and archive pages as the application serves them
      # (listing-layout.spec.js): three posts and a category seeded with fixed values, rendered
      # through the public controller, then rolled back.
      - name: Build the listing layout fixtures
        working-directory: .
        run: php scripts/build-listing-layout-proof-fixtures

      # The shop home and category pages the shop layout proofs measure (shop-layout.spec.js): the
      # shop of ShopPageSeed seeded with fixed values, rendered through the shop controller, then
      # rolled back.
      - name: Build the shop layout fixtures
        working-directory: .
        run: php scripts/build-shop-layout-proof-fixtures

      # Featured product and Add to cart without JavaScript (shop-block-selection.spec.js): an
      # unlinked page and a page naming a deleted product, rendered publicly, then rolled back.
      - name: Build the shop block fixtures
        working-directory: .
        run: php scripts/build-shop-block-proof-fixtures

      # The stage the computed-typography bridge reads (typography-bridge.spec.js): Links blocks in
      # canvas mode — one nested in a Container, one without a title — then rolled back.
      - name: Build the typography bridge fixture
        working-directory: .
        run: php scripts/build-typography-bridge-fixtures

      # Letter spacing, text transform and text decoration as a browser computes them
      # (text-style.spec.js): one page published and on the canvas stage, then rolled back.
      - name: Build the text style fixtures
        working-directory: .
        run: php scripts/build-text-style-fixtures

      # The hover state as a browser computes it (hover.spec.js): pointer, forced preview, focus and
      # touch, on one page published and on the canvas stage, then rolled back.
      - name: Build the hover fixtures
        working-directory: .
        run: php scripts/build-hover-fixtures

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/runtime-browser/package-lock.json

      - run: npm ci

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache restores the browser binaries but not the OS-level shared
      # libraries Chromium links against — those must always be (re)checked.
      - name: Install Chromium OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the smoke gate
        run: npm test
