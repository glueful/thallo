<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search page</title>
<link rel="stylesheet" href="/packages/thallo-search/assets/search.css">
<style>*,*::before,*::after{box-sizing:border-box} body{margin:0;font:16px sans-serif;color:#0f172a}</style>
</head>
<body>
<!-- The /search page's frame as search/results.twig renders it inside a layout whose <main> has no
     side padding of its own. Kept in step with packages/thallo-search/templates. -->
<main class="layout--centered">
<section class="thallo-search-page" aria-labelledby="thallo-search-heading" data-key="page">
  <header class="thallo-search-page__head">
    <h1 id="thallo-search-heading" class="thallo-search-page__title">Results for “oud”</h1>
  </header>
  <p class="thallo-search-page__count">About 10 matches</p>
</section>
</main>
</body>
</html>
