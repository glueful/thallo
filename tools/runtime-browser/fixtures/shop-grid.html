<!doctype html>
<meta charset="utf-8">
<title>Shop grid</title>
<!-- A Product grid as its template renders it: the loading line hidden until shop.js hydrates. The
     spec answers its data endpoint with page.route. -->
<main>
  <div class="thallo-block thallo-block-product-grid" data-shop-block="product-grid"
       data-source="newest" data-category-slug="" data-tag-slug="" data-products="" data-page-size="12">
    <ul class="thallo-block-product-grid__items" data-shop-grid-items hidden></ul>
    <p class="thallo-block-product-grid__empty" data-shop-grid-empty hidden>Loading products…</p>
    <a class="thallo-block-product-grid__view-all" data-shop-grid-view-all hidden href="#">View all products</a>
  </div>
</main>
<script src="/packages/thallo-commerce/assets/shop.js" defer></script>
