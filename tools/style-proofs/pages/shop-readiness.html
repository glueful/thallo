<!doctype html>
<meta charset="utf-8">
<title>Shop readiness</title>
<!-- One of each JavaScript-painted shop block, as their templates render them, for the thumbnail
     capture's readiness check (tests/shop-readiness.spec.js): each test answers the blocks' data
     endpoints itself. -->
<main>
  <div class="thallo-block thallo-block-product-grid" data-shop-block="product-grid" data-source="newest"
       data-category-slug="" data-tag-slug="" data-products="" data-page-size="24">
    <ul class="thallo-block-product-grid__items" data-shop-grid-items hidden></ul>
    <p class="thallo-block-product-grid__empty" data-shop-grid-empty>Loading products…</p>
  </div>
  <div class="thallo-block thallo-block-featured-product" data-shop-block="featured-product"
       data-product-slug="stoneware-bowl" data-entry-uuid="">
    <div class="thallo-block-featured-product__body" data-shop-featured-body hidden></div>
    <p class="thallo-block-featured-product__empty" data-shop-featured-empty hidden>Loading…</p>
  </div>
  <div class="thallo-block thallo-block-add-to-cart" data-shop-block="add-to-cart"
       data-product-slug="stoneware-bowl" data-entry-uuid="">
    <p class="thallo-block-add-to-cart__status" data-shop-add-to-cart-status hidden>Loading…</p>
    <form class="thallo-block-add-to-cart__form" method="post" action="/_shop/cart/add" data-shop-add-to-cart-form hidden>
      <div class="thallo-block-add-to-cart__variant" data-shop-add-to-cart-variant-slot></div>
      <button type="submit">Add to cart</button>
    </form>
    <a class="thallo-block-add-to-cart__link" data-shop-add-to-cart-link hidden href="#">View product</a>
  </div>
</main>
<script src="/packages/thallo-commerce/assets/shop.js" defer></script>
