<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heading lines — balance proof</title>
<!-- The REAL theme sheets, by repo path: the proof server serves the repo root. -->
<link rel="stylesheet" href="/packages/thallo-render/themes/default/assets/site.css">
<link rel="stylesheet" href="/packages/thallo-render/themes/default/assets/blocks.css">
<!-- A heading block at Size 3xl and Width container, as the homepage's h1 is set: the settings'
     compiled rules, written out. The test narrows each heading to just under one line. -->
<style>.col { width: 1400px; } #h1 { max-width: none; font-size: 72px; } #h2 { max-width: none; }</style>
</head>
<body>
<div class="col">
  <h1 class="thallo-block thallo-block-heading" id="h1">Content you own. Upgrades you can trust.</h1>
  <h2 class="thallo-block thallo-block-heading" id="h2">The page, the model, the look and the API, in one admin.</h2>
</div>
</body>
</html>
