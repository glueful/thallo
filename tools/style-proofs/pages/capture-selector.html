<!doctype html>
<meta charset="utf-8">
<title>Capture: a boxed element</title>
<!-- A 1200px page: a 500px header, then the 300px box a thumbnail crops to. -->
<style>body { margin: 0; } header { height: 500px; background: #eee; } #target { height: 300px; background: #cde; }</style>
<main>
  <header></header>
  <div id="target"></div>
</main>
